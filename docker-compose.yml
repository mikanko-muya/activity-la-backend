services:
  db:
    image: mariadb:11
    container_name: activity-la-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-db_activity_la}
      MARIADB_USER: ${DB_USER:-activity}
      MARIADB_PASSWORD: ${DB_PASSWORD:-activity_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: activity-la-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the localhost URL in .env so the API reaches the db container
      DATABASE_URL: mysql://${DB_USER:-activity}:${DB_PASSWORD:-activity_password}@db:3306/${DB_NAME:-db_activity_la}
      PORT: 6767
    ports:
      - "${PORT:-6767}:6767"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
